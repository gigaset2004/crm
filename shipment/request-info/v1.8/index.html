<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Request Supplier Info v1.8</title><link rel="stylesheet" href="styles.css"><script src="https://live.zwidgets.com/js-sdk/1.5/ZohoEmbededAppSDK.min.js"></script><script src="app.js" defer></script></head>
<body><main class="shell">
<header class="topbar"><div class="heading"><h1>Request Info</h1><span class="dot">·</span><strong id="shipmentName" class="shipment-name">Connecting…</strong></div><div class="top-right"><span id="count" class="pill">0 PO</span><button class="secondary" id="refresh" type="button">Refresh</button></div></header>
<div class="toolbar"><span class="title-small">Select information to request</span><span class="muted" id="totalLabel">Choose for each PO</span><label class="all-check"><input type="checkbox" id="allPickup"> Pickup all</label><label class="all-check"><input type="checkbox" id="allPacking"> Packing all</label></div>
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<section class="list-wrap"><div class="po-list" id="list"><div class="empty">Loading Purchase Orders…</div></div><div class="editor-panel" id="editor" hidden><div class="editor-head"><strong id="editorTitle">Edit message</strong><div class="editor-buttons"><button id="resetMessage" type="button" class="secondary">Reset text</button><button id="backToList" type="button" class="secondary">Back to POs</button></div></div><textarea id="messageBody" spellcheck="true" aria-label="Message to supplier" placeholder="Write your message to the supplier"></textarea><span class="editor-hint">This text will be sent as a reply in the linked Front conversation.</span></div></section>
<footer class="bottom"><div class="pagination"><button type="button" id="prev" class="secondary">Previous</button><span id="pageLabel">Page 1</span><button type="button" id="next" class="secondary">Next</button></div><div class="buttons"><button type="button" id="complete" disabled>Complete Request Info</button></div><strong class="version" title="Request Info widget version">v1.8</strong></footer>
</main>
</body></html>
